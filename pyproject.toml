[project]
name = "hsi-toolkit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Александр", email = "siniza.s.94@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.5.4",
    "pyside6>=6.10",
]

[project.scripts]
hsi-toolkit = "hsi_toolkit:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
