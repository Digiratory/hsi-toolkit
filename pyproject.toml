[project]
name = "hsi-toolkit"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Александр", email = "siniza.s.94@gmail.com" }
]
requires-python = ">=3.14"
dynamic = ["version"]
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pyside6>=6.10",
    "scipy>=1.18.1",
]

[project.scripts]
hsi-toolkit = "hsi_toolkit:main"

[build-system]
requires = ["hatchling>=1.27.0", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version", fallback_version = "0.0.0" }

[tool.hatch.build.hooks.vcs]
version-file = "src/hsi_toolkit/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hsi_toolkit"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
